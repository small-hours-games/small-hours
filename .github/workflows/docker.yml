name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/small-hours-games/small-hours

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected). Use npm version."
            exit 1
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Android TV APK is baked into the image at /download/smallhours-tv.apk.
      # It needs the release signing key (secrets ANDROID_KEYSTORE_BASE64 and
      # ANDROID_KEYSTORE_PASSWORD); without them the image ships without the APK.
      - name: Check Android signing secrets
        id: apk
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the image will not include the TV APK."; fi

      - name: Cache Android toolchain
        if: steps.apk.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/smallhours-android
          key: smallhours-android-${{ hashFiles('android-tv/build.sh') }}

      - name: Build Android TV APK
        if: steps.apk.outputs.enabled == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android-tv/keystore
          printf '%s' "$KS" | base64 -d > android-tv/keystore/smallhours-tv.jks
          printf '%s' "$KS_PASSWORD" > android-tv/keystore/password
          REQUIRE_KEYSTORE=1 PUBLISH=1 bash android-tv/build.sh
          rm -rf android-tv/keystore
          test -s public/download/smallhours-tv.apk

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
