<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="darkreader-lock">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f4f8ff">
  <title>Smallhours - Player</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/smallhours.css">
  <link rel="stylesheet" href="/css/player.css">
  <link rel="stylesheet" href="/css/light-lobby.css">
  <link rel="stylesheet" href="/css/table-cards.css">
  <!-- game-styles -->
  <link rel="icon" type="image/svg+xml" href="/images/smallhours-icon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="/images/smallhours-favicon.png">
  <link rel="apple-touch-icon" href="/images/smallhours-icon.png">
</head>
<body class="light-lobby phone-screen text-slate-800 font-sans">

  <!-- Top bar -->
  <header class="bg-white/90 backdrop-blur-md border-b border-sky-100 sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between gap-2">
      <a href="/" class="flex items-center gap-2.5 min-w-0">
        <img class="brand-symbol" src="/images/smallhours-mark.svg" alt="" width="36" height="36">
        <span class="brand-phone-name">Small<span class="brand-accent">hours</span></span>
      </a>
      <div class="flex items-center gap-2 min-w-0">
        <button id="shareBtn" onclick="shareRoom()" aria-label="Share room" class="hidden w-8 h-8 rounded-full bg-sky-50 hover:bg-sky-100 text-sky-700 items-center justify-center">
          <i class="fa-solid fa-share-nodes text-sm"></i>
        </button>
        <span class="font-mono font-bold text-sky-900 tracking-widest text-xs bg-sky-100 border border-sky-200 px-2 py-0.5 rounded-md" id="roomBadge">----</span>
        <div class="flex items-center gap-1.5 bg-white border border-sky-200 rounded-full pl-1 pr-2.5 py-0.5 min-w-0">
          <span class="text-lg leading-none" id="myAvatar">&#128056;</span>
          <span class="text-xs font-bold text-slate-700 truncate max-w-[6rem]" id="myName">Player</span>
        </div>
      </div>
    </div>
    <div class="player-connection-row">
      <div class="connection-status disconnected" id="connStatus" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="connText">Connecting...</span>
      </div>
    </div>
  </header>

  <main class="player-main">

    <!-- NICKNAME (shown when no name is known yet) -->
    <div class="section" id="nameSection">
      <div class="device-screen bg-sky-100 border-4 border-white rounded-[2.5rem] p-6 flex flex-col min-h-[520px] justify-between">
        <div class="text-center pt-2">
          <span class="text-[11px] font-bold text-slate-500 block uppercase">Joining Room</span>
        </div>
        <div class="my-auto space-y-6">
          <div class="text-center">
            <div class="w-20 h-20 mx-auto rounded-3xl bg-amber-100 border-2 border-amber-300 flex items-center justify-center text-amber-600 mb-3 shadow-inner">
              <i class="fa-solid fa-dice text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold font-display text-slate-800">Enter Player Name</h2>
            <p class="text-xs text-slate-500 mt-1">Choose a nickname to join the party</p>
          </div>
          <form id="nameForm" class="bg-white/85 p-5 rounded-2xl border border-sky-200 shadow-sm space-y-4">
            <div>
              <label for="nameInput" class="block text-xs font-bold text-slate-700 mb-1.5 uppercase">Nickname:</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                  <i class="fa-regular fa-face-smile"></i>
                </span>
                <input id="nameInput" type="text" maxlength="20" autocomplete="off" spellcheck="false" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 font-semibold text-slate-800" placeholder="Username" />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
              <a href="/" class="w-full py-3 px-4 bg-white hover:bg-slate-100 text-slate-700 font-bold rounded-xl border border-slate-300 transition text-sm text-center">Back</a>
              <button type="submit" class="w-full py-3 px-4 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-md shadow-sky-600/30 transition text-sm">Join</button>
            </div>
          </form>
        </div>
        <div></div>
      </div>
    </div>

    <!-- GAMES DASHBOARD -->
    <div class="section" id="lobbySection">
      <div class="device-screen bg-sky-100 border-4 border-white rounded-[2rem] p-3.5 flex flex-col gap-2.5">
        <div class="flex items-center justify-between pb-2 border-b border-sky-200">
          <span class="font-display font-bold text-lg text-slate-800">Games Dashboard</span>
          <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-sky-200/80 text-sky-900">Tap to Vote</span>
        </div>
        <button id="categoryReturn" onclick="showSection('categorySection')" class="hidden w-full p-2.5 rounded-xl bg-white border-2 border-sky-400 text-sky-800 text-xs font-extrabold items-center justify-between shadow-sm">
          <span><i class="fa-solid fa-list-check"></i> Quiz category vote is open &mdash; Tap to choose</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>

        <div id="adminControls" class="space-y-2"></div>

        <div id="voteList"></div>

        <!-- Players & current score -->
        <div class="bg-white/95 rounded-xl p-2.5 border border-sky-200 shadow-sm max-h-28 overflow-y-auto" id="lobbyPlayers">
          <div class="text-xs text-slate-500">Waiting for players...</div>
        </div>

        <!-- Chat -->
        <details class="bg-white/95 rounded-xl border border-sky-200 shadow-sm lobby-chat group">
          <summary class="cursor-pointer select-none px-3 py-2 text-xs font-bold text-slate-700 uppercase flex items-center justify-between">
            <span><i class="fa-regular fa-comments text-sky-600"></i> Party Chat</span>
            <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 group-open:rotate-180 transition"></i>
          </summary>
          <div class="px-3 pb-2.5">
            <div class="chat-messages text-sm" id="lobbyChatMessages" role="log" aria-label="Party chat messages" aria-live="polite"></div>
            <div class="flex gap-2 mt-2">
              <input type="text" id="chatInput" placeholder="Say something..." maxlength="200"
                class="flex-1 px-3 py-1.5 rounded-xl border border-slate-300 text-sm"
                onkeydown="if(event.key==='Enter')sendChat()">
              <button onclick="sendChat()" class="px-3.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-sm">Send</button>
            </div>
          </div>
        </details>
      </div>
    </div>

    <!-- QUIZ CATEGORY VOTE -->
    <div class="section" id="categorySection">
      <div class="device-screen bg-sky-100 border-4 border-white rounded-[2.5rem] p-5 flex flex-col gap-3.5">
        <div class="pt-1">
          <div class="flex items-center justify-between pb-3 border-b border-sky-200">
            <button onclick="showSection('lobbySection')" class="text-xs font-bold text-sky-700 hover:underline flex items-center gap-1 px-2 py-1 rounded-lg bg-white/70">
              <i class="fa-solid fa-chevron-left text-[10px]"></i> Games
            </button>
            <h2 class="font-display font-bold text-lg text-slate-800">Pick Quiz Topic</h2>
            <span class="w-12"></span>
          </div>
          <p class="text-xs text-slate-600 text-center mt-2 font-semibold">Tap your favorite topic &mdash; most votes wins!</p>
        </div>

        <div id="categoryAdmin"></div>

        <div id="categoryList" class="space-y-2.5"></div>

        <div class="bg-white/95 rounded-2xl p-3 border border-sky-200 shadow-sm">
          <div class="text-[11px] font-bold text-slate-700 uppercase mb-1.5">Players &bull; Current Score</div>
          <div class="flex flex-wrap gap-x-3 gap-y-1 text-xs text-slate-600" id="categoryScores"></div>
        </div>
      </div>
    </div>

    <!-- game-sections -->
  </main>

  <!-- Toast container -->
  <div class="toast-container" id="toasts"></div>

  <script src="/js/table-cards.js"></script>
  <script src="/js/game-api.js"></script>
  <!-- game-catalog -->
  <script src="/js/games.js"></script>
  <script>
    // --- Avatars ---
    const AVATARS = ['\u{1F438}', '\u{1F431}', '\u{1F984}', '\u{1F41D}', '\u{1F419}', '\u{1F99A}', '\u{1F427}', '\u{1F981}',
                     '\u{1F40B}', '\u{1F424}', '\u{1F423}', '\u{1F994}', '\u{1F418}', '\u{1F410}', '\u{1F999}', '\u{1F417}'];

    // --- State ---
    const state = {
      code: null,
      name: null,
      ws: null,
      ready: false,
      players: [],
      gameType: null,
      myIndex: -1,
      reconnectToken: null,
      reconnectAttempts: 0,
      maxReconnect: 10,
      reconnectTimer: null,
      votedGame: null,
    };

    // --- Init ---
    (function init() {
      const pathParts = window.location.pathname.split('/');
      state.code = pathParts[2]?.toUpperCase();
      try { state.reconnectToken = localStorage.getItem('sh_reconnect_' + state.code); } catch { /* storage unavailable */ }
      const params = new URLSearchParams(window.location.search);
      const urlName = params.get('name')?.trim();
      const savedName = (() => { try { return localStorage.getItem('sh_player_name'); } catch { return null; } })();
      state.name = urlName || (savedName || '').trim() || null;

      if (!state.code || state.code.length !== 4) {
        document.querySelector('.player-main').innerHTML =
          '<div class="device-screen bg-sky-100 border-4 border-white rounded-[2.5rem] p-6 text-center space-y-3">' +
          '<h2 class="font-display text-2xl font-bold text-slate-800">Invalid Room</h2>' +
          '<p class="text-sm text-slate-500">No valid room code in the link.</p>' +
          '<a href="/" class="inline-block py-3 px-6 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-md shadow-sky-600/30">Go Home</a></div>';
        return;
      }

      document.getElementById('roomBadge').textContent = state.code;
      if (navigator.share || navigator.clipboard) document.getElementById('shareBtn').classList.replace('hidden', 'flex');

      if (!state.name) {
        showSection('nameSection');
        document.getElementById('nameInput').focus();
        document.getElementById('nameForm').addEventListener('submit', function(e) {
          e.preventDefault();
          const name = document.getElementById('nameInput').value.trim();
          if (!name) return;
          // Remember the name so the player never has to type it again.
          try { localStorage.setItem('sh_player_name', name); } catch { /* ignore */ }
          // Reload with name param
          window.location.href = '/player/' + state.code + '?name=' + encodeURIComponent(name);
        });
        return;
      }

      // Name known (from URL or remembered) — remember it and join directly.
      try { localStorage.setItem('sh_player_name', state.name); } catch { /* ignore */ }

      document.getElementById('myName').textContent = state.name;
      showSection('lobbySection');

      connect();
    })();

    // --- WebSocket ---
    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = protocol + '//' + location.host + '/ws/player/' + state.code;

      setConnectionStatus('reconnecting', 'Connecting...');

      const ws = new WebSocket(url);
      state.ws = ws;

      ws.onopen = () => {
        state.reconnectAttempts = 0;
        setConnectionStatus('connected', 'Connected');
        // Send join message
        send({ type: 'JOIN_LOBBY', username: state.name, reconnectToken: state.reconnectToken });
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          handleMessage(msg);
        } catch (err) {
          console.error('Bad message:', err);
        }
      };

      ws.onclose = () => {
        setConnectionStatus('disconnected', 'Disconnected');
        scheduleReconnect();
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    function scheduleReconnect() {
      if (state.reconnectAttempts >= state.maxReconnect) {
        setConnectionStatus('disconnected', 'Connection lost');
        showToast('Connection lost. Please refresh.', 'error');
        return;
      }
      const delay = Math.min(1000 * Math.pow(2, state.reconnectAttempts), 30000);
      state.reconnectAttempts++;
      setConnectionStatus('reconnecting', 'Reconnecting (' + state.reconnectAttempts + ')...');
      clearTimeout(state.reconnectTimer);
      state.reconnectTimer = setTimeout(connect, delay);
    }

    function send(msg) {
      if (state.ws?.readyState === WebSocket.OPEN) {
        state.ws.send(JSON.stringify(msg));
      }
    }

    // --- Message handling ---
    function handleMessage(msg) {
      switch (msg.type) {
        case 'JOIN_OK':
          state.reconnectToken = msg.reconnectToken || null;
          try {
            if (state.reconnectToken) localStorage.setItem('sh_reconnect_' + state.code, state.reconnectToken);
          } catch { /* keep the token in memory when storage is unavailable */ }
          state.playerId = msg.playerId;
          state.myIndex = msg.index ?? 0;
          if (msg.avatar) document.getElementById('myAvatar').textContent = msg.avatar;
          showToast('Joined room ' + state.code, 'success');
          break;

        case 'LOBBY_UPDATE': {
          const lobbyState = msg.state || msg;
          state.players = lobbyState.players || [];
          state.isAdmin = state.players.some(p => p.playerId === state.playerId && p.isAdmin);
          state.gameSuggestions = lobbyState.gameSuggestions || {};
          state.leadingGame = lobbyState.leadingGame || null;
          const wasVoting = state.votingActive;
          state.votingActive = !!lobbyState.votingActive;
          state.availableCategories = lobbyState.availableCategories || [];
          state.voteTallies = lobbyState.voteTallies || {};
          if (!state.votingActive) state.myCategory = null;
          renderLobby();
          // Category vote opened/closed: move between dashboard and category picker
          if (!state.gameType && state.votingActive && !wasVoting) showSection('categorySection');
          if (!state.votingActive && isSectionActive('categorySection')) showSection('lobbySection');
          break;
        }

        case 'MINI_GAME_STARTING':
          state.gameType = msg.gameType;
          SH.game(msg.gameType)?.onEnter?.();
          showSection(getGameSectionId(msg.gameType));
          showToast('Game starting!', 'success');
          break;

        case 'GAME_STATE':
          handleGameState(msg);
          break;

        case 'ERROR':
          showToast(msg.message || 'An error occurred', 'error');
          SH.game(state.gameType)?.redraw?.();
          break;

        case 'CHAT_MESSAGE':
          addChatMessage(msg.username || msg.name || 'Player', msg.text, msg.avatar);
          break;

        default:
          console.log('Unknown message:', msg);
      }
    }

    function handleGameState(msg) {
      // Track game type and player names if provided
      if (msg.gameType) state.gameType = msg.gameType;
      if (msg.playerNames) state.playerNames = msg.playerNames;

      if (msg.phase === 'finished') {
        if (msg.winner) {
          showToast('Game over! Winner decided!', 'success');
        }
        // Show final state before returning to lobby
        SH.game(state.gameType)?.render(msg);
        // Return to lobby after a delay
        setTimeout(() => {
          SH.game(state.gameType)?.reset?.();
          state.gameType = null;
          state.ready = false;
          showSection('lobbySection');
        }, 3000);
        return;
      }

      // Ensure game section is visible
      if (state.gameType) {
        const sectionId = getGameSectionId(state.gameType);
        const section = document.getElementById(sectionId);
        if (section && !section.classList.contains('active')) {
          showSection(sectionId);
        }
      }

      SH.game(state.gameType)?.render(msg);
    }

    // --- Sections ---
    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      const el = document.getElementById(id);
      if (el) {
        el.classList.add('active');
        el.style.animation = 'none';
        el.offsetHeight; // force reflow
        el.style.animation = 'fadeIn 0.3s ease';
      }
    }

    function getGameSectionId(game) {
      return SH.game(game)?.section || 'lobbySection';
    }

    // Keep the phone awake while it is the controller. The lock drops whenever the tab
    // is hidden, so ask again on return; it needs a tap first, and HTTPS.
    let wakeLock = null;
    async function keepAwake() {
      if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } catch { /* not allowed right now (no tap yet, battery saver): try later */ }
    }
    document.addEventListener('pointerdown', keepAwake, { passive: true });
    document.addEventListener('visibilitychange', keepAwake);

    function isSectionActive(id) {
      return !!document.getElementById(id)?.classList.contains('active');
    }

    // --- Dashboard: vote for next activity ---
    function connectedCount() {
      return state.players.filter(p => p.connected !== false).length;
    }

    function votesLabel(n) {
      return n + ' vote' + (n === 1 ? '' : 's');
    }

    // Alone in the room: card games can be played against AI opponents.
    function playsVsAi(g) {
      return !!g.aiMax && connectedCount() === 1;
    }

    function gameBlurb(g) {
      return playsVsAi(g) ? g.soloBlurb : g.blurb;
    }

    function gameBlocker(g) {
      if (!g.hasUi) return 'Soon';
      const n = connectedCount();
      if (n < g.min && !playsVsAi(g)) return g.min + '+ players';
      if (n > g.max) return 'Max ' + g.max;
      return null;
    }

    function renderLobby() {
      renderVoteList();
      renderAdminControls();
      renderLobbyPlayers();
      renderCategoryVote();
      const back = document.getElementById('categoryReturn');
      back.classList.toggle('hidden', !state.votingActive);
      back.classList.toggle('flex', !!state.votingActive);
    }

    function renderVoteList() {
      const counts = {};
      Object.values(state.gameSuggestions || {}).forEach(g => { counts[g] = (counts[g] || 0) + 1; });
      const mine = (state.gameSuggestions || {})[state.playerId];
      // Keep playable games in a stable order so cards don't jump under the player's thumb
      const games = [...SH_GAMES].sort((a, b) => (gameBlocker(a) ? 1 : 0) - (gameBlocker(b) ? 1 : 0));

      const html = '<div class="lobby-game-list">' + games.map(g => {
        const blocker = gameBlocker(g);
        const count = counts[g.type] || 0;
        const isMine = g.type === mine;
        const isLeading = state.leadingGame === g.type && count > 0;
        const badgeText = isMine ? '✓ Picked' : (isLeading ? '★ Leading' : '');
        return '<button class="lobby-game-option' + (isMine ? ' is-selected' : '') + '" data-game="' + g.type +
          '" aria-pressed="' + isMine + '" ' + (blocker ? 'disabled' : 'onclick="suggestGame(this.dataset.game)"') + '>' +
          '<span class="lobby-game-icon" aria-hidden="true">' + g.icon + '</span>' +
          '<span class="lobby-game-info"><span class="lobby-game-name">' + escapeHtml(g.label) + '</span>' +
          '<span class="lobby-game-description">' + escapeHtml(blocker || gameBlurb(g)) + '</span></span>' +
          '<span class="lobby-vote-side"><span class="lobby-vote-count">' + count + '</span>' +
          (badgeText ? '<span class="lobby-leading-label">' + badgeText + '</span>' : '') + '</span></button>';
      }).join('') + '</div>';

      document.getElementById('voteList').innerHTML = html;
    }

    function suggestGame(game) {
      state.votedGame = game;
      send({ type: 'SUGGEST_GAME', gameType: game });
    }

    function renderAdminControls() {
      const controls = document.getElementById('adminControls');
      const leader = state.leadingGame ? shGame(state.leadingGame) : null;
      const admin = state.players.find(p => p.isAdmin);

      if (!state.isAdmin) {
        controls.innerHTML = leader
          ? '<div class="p-3 rounded-2xl bg-white/90 border border-sky-200 text-center text-xs text-slate-600 shadow-sm">' +
            '<span class="font-bold text-slate-800">' + leader.icon + ' ' + escapeHtml(leader.label) + '</span> is leading &mdash; waiting for <b>' + escapeHtml(admin?.username || 'the host') + '</b> to press Start!</div>'
          : '';
        return;
      }

      let html = '';
      const vsAi = leader && playsVsAi(leader);
      if (vsAi && leader.aiMax > 1) {
        const seats = state.aiSeats || 2;
        html += '<div class="ai-seat-picker"><span class="ai-seat-label">AI opponents</span><div class="grid grid-cols-4 gap-2">' +
          Array.from({ length: leader.aiMax }, (_, i) => i + 1).map(n =>
          '<button onclick="setAiSeats(' + n + ')" aria-pressed="' + (seats === n) + '" class="p-2.5 rounded-xl border-2 text-sm font-extrabold transition ' +
          (seats === n ? 'bg-sky-50 border-sky-500 text-sky-900 shadow-sm' : 'bg-white/90 border-sky-200 text-slate-700') + '">' +
          '\u{1F916} ' + n + '</button>').join('') + '</div></div>';
      }
      const lobbyOptions = leader && SH.game(leader.type)?.lobbyOptions;
      if (lobbyOptions) html += lobbyOptions();
      if (leader) {
        const label = SH.game(leader.type)?.startLabel?.()
          || (vsAi ? 'Play ' + escapeHtml(leader.label) + ' vs AI'
            : 'Start ' + escapeHtml(leader.label) + ' Now');
        html += '<button onclick="startGame()" id="startGameBtn" class="start-game-cta">' +
          '<i class="fa-solid fa-play text-base"></i> <span>' + leader.icon + ' ' + label + '</span></button>';
      } else {
        html += '<button disabled id="startGameBtn" class="start-game-cta">' +
          '<i class="fa-solid fa-hand-pointer"></i> <span>Tap a game below to enable Start</span></button>';
      }
      controls.innerHTML = html;
    }

    function setAiSeats(n) {
      state.aiSeats = n;
      renderAdminControls();
    }

    // The server resolves the most-voted game (quiz first opens its category vote).
    function startGame() {
      const config = {};
      Object.assign(config, SH.game(state.leadingGame)?.startConfig?.());
      const leader = shGame(state.leadingGame);
      if (playsVsAi(leader)) config.bots = Math.min(state.aiSeats || 2, leader.aiMax);
      send({ type: 'START_VOTED_GAME', config });
      // Getting a quiz ready can take a few seconds: show that the tap was heard.
      document.querySelectorAll('.start-game-cta').forEach(btn => {
        const label = btn.innerHTML;
        btn.disabled = true;
        btn.textContent = 'Starting…';
        setTimeout(() => { btn.disabled = false; btn.innerHTML = label; }, 6000);
      });
    }


    // --- Players & current score ---
    function sortedPlayers() {
      return [...state.players].sort((a, b) => (b.sessionScore || 0) - (a.sessionScore || 0));
    }

    function renderLobbyPlayers() {
      const container = document.getElementById('lobbyPlayers');
      const rows = sortedPlayers().map(p => {
        const isMe = p.playerId === state.playerId;
        const voted = (state.gameSuggestions || {})[p.playerId];
        const crown = p.isAdmin ? '<i class="fa-solid fa-crown text-amber-500 text-[10px]"></i> ' : '';
        const vote = voted ? '<span class="text-[11px]" title="Voted ' + escapeHtml(shGame(voted).label) + '">' + shGame(voted).icon + '</span>' : '';
        return '<div class="flex justify-between items-center py-1 px-2 rounded-lg ' +
            (isMe ? 'bg-sky-50 text-slate-800 font-medium' : 'bg-slate-50 text-slate-600') + (p.connected === false ? ' opacity-50' : '') + '">' +
          '<span class="flex items-center gap-1.5 min-w-0"><span class="lobby-avatar-glyph">' + escapeHtml(p.avatar || '🎮') + '</span>' + crown +
            '<span class="truncate">' + escapeHtml(p.username || p.name) + (isMe ? ' (You)' : '') + '</span>' + vote + '</span>' +
          '<span class="font-bold shrink-0 ' + (isMe ? 'text-sky-700' : 'text-slate-700') + '">' + (p.sessionScore || 0) + ' pts</span>' +
        '</div>';
      }).join('');

      container.innerHTML =
        '<div class="flex items-center justify-between mb-2">' +
          '<span class="text-xs font-bold text-slate-700 uppercase">Players &middot; Score</span>' +
          '<span class="text-[10px] text-slate-500 font-medium">' + connectedCount() + ' in lobby</span>' +
        '</div>' +
        '<div class="space-y-1.5 text-xs">' + (rows || '<div class="text-slate-500">Waiting for players...</div>') + '</div>';
    }

    // --- Quiz category vote ---
    function renderCategoryVote() {
      if (!state.votingActive) return;
      const tallies = state.voteTallies || {};
      const cats = state.availableCategories || [];
      const max = Math.max(0, ...Object.values(tallies));
      const isGeo = c => /geograph/i.test(c.name);

      const voteMeta = c => {
        const n = tallies[c.id] || 0;
        return n ? votesLabel(n) + (n === max ? ' &middot; leading' : '') : '';
      };

      const featured = cats.filter(isGeo).map(c => {
        const mine = state.myCategory === c.id;
        return '<button onclick="voteCategory(' + c.id + ')" class="w-full p-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-extrabold text-sm transition flex items-center justify-between shadow-md' +
          (mine ? ' ring-3 ring-offset-2 ring-offset-sky-100 ring-emerald-400' : '') + '">' +
          '<span class="flex items-center gap-2"><span class="text-lg">' + shCategoryIcon(c.name) + '</span>' + escapeHtml(shCategoryLabel(c.name)) + ' (Map Challenge)</span>' +
          '<span class="text-xs bg-white/25 px-2 py-0.5 rounded-lg">' + (voteMeta(c) || (mine ? '✓ Picked' : 'Vote')) + '</span>' +
        '</button>';
      }).join('');

      const others = cats.filter(c => !isGeo(c)).map(c => {
        const mine = state.myCategory === c.id;
        return '<button onclick="voteCategory(' + c.id + ')" class="p-3.5 rounded-2xl border-2 font-bold text-xs transition flex flex-col items-center justify-center gap-1 shadow-sm ' +
          (mine ? 'bg-sky-50 border-sky-500 ring-2 ring-sky-300 text-sky-900' : 'bg-white/95 hover:bg-white border-sky-200 text-slate-800') + '">' +
          '<span class="flex items-center gap-1.5 text-center leading-snug"><span class="text-base">' + shCategoryIcon(c.name) + '</span>' + escapeHtml(shCategoryLabel(c.name)) + '</span>' +
          '<span class="text-[11px] text-sky-700 font-extrabold min-h-[1em]">' + (voteMeta(c) || (mine ? '✓ Picked' : '')) + '</span>' +
        '</button>';
      }).join('');

      document.getElementById('categoryList').innerHTML = featured +
        '<div class="grid grid-cols-2 gap-2.5 max-h-[48vh] overflow-y-auto no-scrollbar">' + others + '</div>';

      document.getElementById('categoryAdmin').innerHTML = state.isAdmin
        ? '<button onclick="startGame()" class="start-game-cta"><i class="fa-solid fa-play"></i> <span>🎯 Start Quiz Round Now</span></button>'
        : '<div class="p-2.5 rounded-xl bg-white/85 border border-sky-200 text-center text-xs text-slate-600 font-medium">Waiting for the host to launch the quiz&hellip;</div>';

      document.getElementById('categoryScores').innerHTML = sortedPlayers().map(p =>
        '<span>' + escapeHtml(p.username || p.name) + ': <b class="text-sky-700">' + (p.sessionScore || 0) + '</b></span>'
      ).join('');
    }

    function voteCategory(id) {
      state.myCategory = id;
      send({ type: 'CATEGORY_VOTE', categoryId: id });
      renderCategoryVote();
    }

    // --- Chat ---
    function shareRoom() {
      const url = window.location.origin + '/player/' + state.code;
      if (navigator.share) {
        navigator.share({ title: 'Join my Small Hours game!', text: 'Room code: ' + state.code, url });
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => showToast('Link copied!', 'success'));
      }
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      send({ type: 'CHAT_MESSAGE', text });
      input.value = '';
    }

    function addChatMessage(name, text, avatar) {
      const container = document.getElementById('lobbyChatMessages');
      const el = document.createElement('div');
      el.className = 'chat-msg';
      el.innerHTML = '<span class="author"><span class="chat-avatar" aria-hidden="true">' + escapeHtml(avatar || '💬') + '</span> ' + escapeHtml(name || 'Player') + '</span><span class="chat-text">' + escapeHtml(text) + '</span>';
      container.appendChild(el);
      container.scrollTop = container.scrollHeight;
      while (container.children.length > 50) container.removeChild(container.firstChild);
    }

    // --- Card table helpers (rendering kit in /js/table-cards.js) ---
    // Card sizes depend on the screen, so redraw the open card table on rotate/resize.
    let tcResizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(tcResizeTimer);
      tcResizeTimer = setTimeout(() => {
        SH.game(state.gameType)?.redraw?.();
      }, 150);
    });

    // The card screen fills the rest of the viewport so the hand zone ends at the bottom.
    function tcFitScreen(sectionId) {
      const el = document.getElementById(sectionId);
      if (!el || !el.classList.contains('active')) return;
      const pad = parseFloat(getComputedStyle(el.parentElement).paddingBottom) || 0;
      document.documentElement.style.setProperty('--tc-screen-top', Math.round(el.getBoundingClientRect().top + window.scrollY + pad) + 'px');
    }

    // Cards that reach the hand fly in from the table and glow until a card leaves the hand.
    const tcArrivals = {};
    const TC_MAX_ARRIVAL_FLIGHTS = 4;

    /** Compare with the last update of this round; round null means no hand is in play. */
    function tcTrackArrivals(key, hand, round) {
      const t = tcArrivals[key] || (tcArrivals[key] = { ids: null, round: null, fresh: new Set(), flying: new Set() });
      const ids = hand.map(c => c.id);
      const sameRound = round != null && t.round === round && !!t.ids;
      const arrived = sameRound ? tcNewCardIds(t.ids, hand) : [];
      if (arrived.length) t.fresh = new Set(arrived);
      else if (!sameRound || t.ids.some(id => !ids.includes(id))) t.fresh.clear();
      t.ids = ids;
      t.round = round;
      arrived.slice(0, TC_MAX_ARRIVAL_FLIGHTS).forEach(id => t.flying.add(id));
      return { t, arrived };
    }

    function tcArrivalOpts(track, c, group) {
      const cards = group || [c];
      return {
        isNew: cards.some(g => track.t.fresh.has(g.id)),
        className: track.t.flying.has(c.id) ? 'tc-in-flight' : '',
      };
    }

    function tcLaunchArrivals(track, hand, fromEl, handEl) {
      track.arrived.slice(0, TC_MAX_ARRIVAL_FLIGHTS).forEach((id, i) => {
        tcFlyToHand(hand.find(c => c.id === id), fromEl, handEl, {
          delay: i * 200,
          onDone: () => {
            track.t.flying.delete(id);
            const el = tcHandCard(handEl, id);
            if (el) el.classList.remove('tc-in-flight');
          },
        });
      });
    }

    function tcLayout() {
      if (!state.tcLayout) {
        try { state.tcLayout = localStorage.getItem('sh_card_layout') || 'rack'; } catch { state.tcLayout = 'rack'; }
      }
      return state.tcLayout;
    }
    function tcSetLayout(layout) {
      state.tcLayout = layout;
      try { localStorage.setItem('sh_card_layout', layout); } catch { /* ignore */ }
    }
    function tcHandWidth(id) {
      const el = document.getElementById(id);
      const w = el && el.clientWidth ? el.clientWidth : window.innerWidth - 24;
      return Math.max(240, Math.min(w, 560) - 6);
    }
    // Hand cards grow with the phone: taller screens get bigger cards, and a row
    // always shows at least ~4 cards side by side.
    function tcHandCardW(id) {
      const byHeight = Math.round(window.innerHeight * 0.1);
      const byWidth = Math.floor(tcHandWidth(id) / 4.2);
      return Math.max(62, Math.min(92, byHeight, byWidth));
    }
    function tcName(id, msg) {
      const names = (msg && msg.playerNames) || state.playerNames || {};
      return names[id] || 'Player';
    }
    function tcAvatar(id) {
      if (String(id).startsWith('bot_')) return '\u{1F916} ';
      const p = (state.players || []).find(x => x.playerId === id);
      return p && p.avatar ? p.avatar + ' ' : '';
    }
    function tcSetStatus(prefix, text, myTurn) {
      document.getElementById(prefix + 'StatusText').textContent = text;
      document.getElementById(prefix + 'Status').classList.toggle('tc-my-turn', !!myTurn);
      document.getElementById(prefix + 'StatusDot').classList.toggle('tc-dot-live', !!myTurn);
    }
    function tcBuzz(key, isTurn) {
      if (isTurn && !state[key] && navigator.vibrate) navigator.vibrate([50, 30, 50]);
      state[key] = !!isTurn;
    }
    // Four-colour suits on the phone: an option, remembered per phone.
    function tcFourColourPref() {
      try { return localStorage.getItem('sh_four_colour') === '1'; } catch { return false; }
    }
    tcSetFourColour(tcFourColourPref());
    function tcToggleFourColour() {
      tcSetFourColour(!tcFourColourOn);
      try { localStorage.setItem('sh_four_colour', tcFourColourOn ? '1' : '0'); } catch { /* ignore */ }
      SH.game(state.gameType)?.redraw?.();
    }
    function tcSyncColoursBtn(id) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.classList.toggle('tc-active', tcFourColourOn);
      btn.setAttribute('aria-pressed', tcFourColourOn ? 'true' : 'false');
    }
    /** The big thumb button: a verb plus the card it plays ("Play [6♥]", "Play 3 × [6♣]"). */
    function tcSetCta(id, cta) {
      const btn = document.getElementById(id);
      if (cta.verb && cta.card) {
        btn.innerHTML = '<span class="tc-cta-label">' + escapeHtml(cta.verb + (cta.count > 1 ? ' ' + tcNum(cta.count) + ' ×' : '')) + '</span>' + renderCardChip(cta.card);
        btn.setAttribute('aria-label', cta.label);
      } else {
        btn.textContent = cta.label;
        btn.removeAttribute('aria-label');
      }
      btn.disabled = !!cta.disabled;
      btn.dataset.action = cta.action || '';
      btn.classList.toggle('tc-cta-gin', cta.action === 'knock-gin');
    }

    // --- UI Helpers ---
    function setConnectionStatus(status, text) {
      const el = document.getElementById('connStatus');
      el.className = 'connection-status ' + status;
      document.getElementById('connText').textContent = text;
    }

    function showToast(message, type) {
      const container = document.getElementById('toasts');
      const toast = document.createElement('div');
      toast.className = 'toast' + (type ? ' toast-' + type : '');
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('toast-exit');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
  <!-- game-scripts -->
</body>
</html>
