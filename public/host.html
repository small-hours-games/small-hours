<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e0f2fe">
  <title>Smallhours - TV Screen</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/smallhours.css">
  <link rel="stylesheet" href="/css/host.css">
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Top bar -->
  <header class="bg-white/90 backdrop-blur-md border-b border-sky-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20">
          <i class="fa-solid fa-gamepad text-lg"></i>
        </div>
        <span class="font-display text-2xl font-bold tracking-tight text-slate-900">Smallhours</span>
        <span id="headerInfo" class="hidden sm:inline-block ml-1 text-xs font-semibold px-2 py-0.5 rounded-full bg-sky-100 text-sky-700"></span>
      </div>
      <div class="flex items-center gap-3">
        <!-- Connection status (in the header so it never covers the Sound button) -->
        <div class="connection-status disconnected" id="connStatus">
          <span class="status-dot"></span>
          <span id="connText">Connecting...</span>
        </div>
        <button id="muteBtn" onclick="toggleMute()" class="text-sm font-semibold px-3 py-1.5 rounded-lg text-slate-600 bg-white border border-sky-200 hover:bg-sky-50 transition">🔊 Sound</button>
      </div>
    </div>
  </header>

  <main class="host-main">
    <!-- Lobby: join info, live vote, players & score -->
    <div id="lobbyView" class="w-full max-w-7xl grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.4fr)_minmax(0,1fr)] items-start">

      <section class="device-screen bg-sky-100 border-4 border-white rounded-[2.5rem] p-6 flex flex-col items-center text-center">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-white/70 text-sky-800 border border-sky-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Party Online
        </span>
        <p class="mt-5 text-xs font-bold uppercase tracking-wider text-slate-500">Join with Room Code</p>
        <div class="font-mono font-bold text-6xl tracking-[0.2em] text-sky-900 bg-white/80 border border-sky-200 rounded-2xl px-5 py-3 mt-2 shadow-sm" id="roomCode">----</div>
        <div id="qrContainer" class="mt-5 bg-white p-2 rounded-2xl border border-sky-200 shadow-sm w-[180px] h-[180px] flex items-center justify-center"></div>
        <p class="mt-4 text-xs text-slate-500">Scan or open</p>
        <p class="text-sm font-semibold text-sky-800 break-all" id="joinUrl"></p>
      </section>

      <section class="device-screen bg-sky-100 border-4 border-white rounded-[2.5rem] p-6 flex flex-col gap-4">
        <div class="flex items-center justify-between pb-3 border-b border-sky-200">
          <h2 class="font-display font-bold text-2xl text-slate-800" id="voteTitle">Vote for next activity</h2>
          <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2 py-0.5 rounded-full border border-emerald-200" id="voteCount">0 votes</span>
        </div>
        <div id="hostVotes" class="space-y-2.5"></div>
        <p class="text-xs text-slate-500 text-center" id="voteHint">Wish for a game on your phone. The most picked game is chosen and the next phase begins.</p>
      </section>

      <section class="device-screen bg-sky-100 border-4 border-white rounded-[2.5rem] p-6 flex flex-col gap-3">
        <div class="flex items-center justify-between pb-3 border-b border-sky-200">
          <h2 class="font-display font-bold text-2xl text-slate-800">Players</h2>
          <span class="text-xs text-slate-500 font-semibold" id="playerCount">(0)</span>
        </div>
        <div class="space-y-1.5" id="playerGrid">
          <div class="text-sm text-slate-500">Waiting for players to join...</div>
        </div>
      </section>
    </div>

    <!-- Game View -->
    <div id="gameView" class="game-view">
      <div class="game-header">
        <div>
          <div class="game-title" id="gameTitle">Game</div>
          <div class="round-info" id="roundInfo"></div>
        </div>
        <div class="timer-seconds" id="timerSeconds" style="display:none;" aria-live="polite"></div>
      </div>
      <div class="timer-bar-container" id="timerContainer" style="display:none;">
        <div class="timer-bar" id="timerBar"></div>
      </div>
      <div class="game-content" id="gameContent"></div>
    </div>

  </main>

  <!-- Chat overlay -->
  <div class="chat-panel" id="chatPanel" style="display:none;">
    <div class="chat-title">Party chat</div>
    <div class="messages" id="chatMessages" role="log" aria-label="Party chat messages" aria-live="polite"></div>
  </div>

  <!-- Scoreboard sidebar -->
  <div class="scoreboard-panel card" id="scorePanel" style="display:none;" role="region" aria-label="Live Scoreboard">
    <div id="scoreList"></div>
  </div>

  <!-- Game story / narration overlay -->
  <div id="storyOverlay" class="story-overlay" style="display:none;">
    <div class="story-inner">
      <div class="story-badge" id="storyBadge">⚔️</div>
      <h1 class="story-title neon" id="storyTitle">Spelet börjar</h1>
      <p class="story-text" id="storyText"></p>
      <button class="btn btn-primary" id="storySkipBtn" style="max-width:240px;margin:18px auto 0;">Fortsätt</button>
    </div>
  </div>


  <!-- Toast container -->
  <div class="toast-container" id="toasts"></div>

  <script src="/js/cards.js"></script>
  <script src="/js/games.js"></script>
  <script src="/js/quiz-ready.js"></script>
  <script src="/js/music-fade.js"></script>
  <script>
    // --- State ---
    const AVATARS = ['&#128056;', '&#128049;', '&#129412;', '&#128029;', '&#128025;', '&#129418;', '&#128039;', '&#129409;',
                     '&#128011;', '&#128036;', '&#128035;', '&#129428;', '&#128024;', '&#128016;', '&#129433;', '&#128023;'];

    // Opened by the Android TV app (via /tv): recover on its own, never leave the host screen
    const TV_MODE = new URLSearchParams(location.search).get('tv') === '1';
    // TV WebViews report ~960 CSS px; lay out at 1280 (scaled to fit) for the wide lobby layout
    if (TV_MODE) document.querySelector('meta[name="viewport"]')?.setAttribute('content', 'width=1280');

    const state = {
      code: null,
      ws: null,
      players: [],
      gameType: null,
      gameState: null,
      reconnectAttempts: 0,
      maxReconnect: 10,
      reconnectTimer: null,
    };

    // Mute toggle
    let isMuted = false;
    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById('muteBtn').textContent = isMuted ? '\uD83D\uDD07 Muted' : '\uD83D\uDD0A Sound';
      if (musicAudio) musicAudio.muted = isMuted;
      if (isMuted) {
        audio._origPlay = audio._origPlay || audio.play;
        audio.play = () => {};
      } else if (audio._origPlay) {
        audio.play = audio._origPlay;
      }
    }

    // Sound state tracking — prevent duplicate triggers on re-renders
    var lastShState = {};
    var lastGrState = {};

    // Init audio on first user interaction (required by browser autoplay policy)
    document.addEventListener('click', function() { audio.init(); }, { once: true });
    document.addEventListener('keydown', function() { audio.init(); }, { once: true });

    // --- Init ---
    (function init() {
      const pathParts = window.location.pathname.split('/');
      state.code = pathParts[2]?.toUpperCase();

      // Load game narratives for the story overlay (best-effort).
      fetch('/api/stories').then(r => r.json()).then(d => {
        if (d && d.stories) window.SMALL_HOURS_STORIES = d.stories;
      }).catch(() => {});

      if (!state.code || state.code.length !== 4) {
        if (TV_MODE) { location.replace('/tv'); return; }
        document.querySelector('.host-main').innerHTML =
          '<div class="card text-center" style="max-width:400px;"><h2>Invalid Room</h2><p class="mt-2 text-secondary">No valid room code in URL.</p><a href="/" class="btn btn-primary mt-2">Go Home</a></div>';
        return;
      }

      document.getElementById('roomCode').textContent = state.code;
      document.getElementById('headerInfo').textContent = 'Room: ' + state.code;

      const joinUrl = window.location.origin + '/player/' + state.code;
      document.getElementById('joinUrl').textContent = joinUrl;

      // Generate QR code locally
      const qrContainer = document.getElementById('qrContainer');
      if (typeof QRCode !== 'undefined') {
        new QRCode(qrContainer, { text: joinUrl, width: 164, height: 164, colorDark: '#000000', colorLight: '#ffffff' });
      }

      connect();
    })();

    // --- WebSocket ---
    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = protocol + '//' + location.host + '/ws/host/' + state.code;

      setConnectionStatus('reconnecting', 'Connecting...');

      const ws = new WebSocket(url);
      state.ws = ws;

      ws.onopen = () => {
        state.reconnectAttempts = 0;
        setConnectionStatus('connected', 'Connected');
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          handleMessage(msg);
        } catch (err) {
          console.error('Bad message:', err);
        }
      };

      ws.onclose = (e) => {
        // TV app: the room is gone (e.g. the server restarted), so start a fresh one
        if (TV_MODE && e && e.code === 4004) {
          location.replace('/tv');
          return;
        }
        setConnectionStatus('disconnected', 'Disconnected');
        scheduleReconnect();
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    function scheduleReconnect() {
      // The TV app has nobody to press refresh, so it keeps trying (every 30 s at most)
      if (state.reconnectAttempts >= state.maxReconnect && !TV_MODE) {
        setConnectionStatus('disconnected', 'Connection lost');
        showToast('Connection lost. Please refresh the page.', 'error');
        return;
      }
      const delay = Math.min(1000 * Math.pow(2, state.reconnectAttempts), 30000);
      state.reconnectAttempts++;
      setConnectionStatus('reconnecting', 'Reconnecting (' + state.reconnectAttempts + ')...');
      clearTimeout(state.reconnectTimer);
      state.reconnectTimer = setTimeout(connect, delay);
    }

    function send(msg) {
      if (state.ws?.readyState === WebSocket.OPEN) {
        state.ws.send(JSON.stringify(msg));
      }
    }

    // --- Message handling ---
    function handleMessage(msg) {
      switch (msg.type) {
        case 'DISPLAY_OK':
          showToast('Connected as host', 'success');
          break;

        case 'LOBBY_UPDATE':
          state.lobby = msg.state || msg;
          state.players = state.lobby.players || [];
          state.playerAvatars = state.playerAvatars || {};
          state.players.forEach(p => { state.playerAvatars[p.playerId] = p.avatar; });
          renderPlayers();
          renderHostVotes();
          break;

        case 'PLAYER_JOINED':
          showToast(msg.name + ' joined!', 'success');
          break;

        case 'PLAYER_REMOVED':
          showToast(msg.name + ' left', 'info');
          break;

        case 'ADMIN_CHANGED':
          showToast(msg.name + ' is now the admin');
          break;

        case 'MINI_GAME_STARTING':
          state.gameType = msg.gameType;
          showGameView(msg);
          break;

        case 'GAME_STATE':
          if (msg.gameType) state.gameType = msg.gameType;
          if (msg.playerNames) state.playerNames = msg.playerNames;
          state.gameState = msg;
          // Track guess events for host display
          if (msg.events) {
            if (!state.gameEvents) state.gameEvents = [];
            state.gameEvents.push(...msg.events);
          }
          renderGameState(msg);
          break;

        case 'GAME_EVENT':
          if (!state.gameEvents) state.gameEvents = [];
          state.gameEvents.push(msg.event);
          break;

        case 'CHAT_MESSAGE':
          addChatMessage(msg.username || msg.name || 'Player', msg.text, msg.avatar);
          break;

        case 'SERVER_RESTARTING':
          showToast('Server restarting, please wait...', 'error');
          break;

        default:
          console.log('Unknown message:', msg);
      }
    }

    // --- Render: Lobby ---
    function renderPlayers() {
      const grid = document.getElementById('playerGrid');
      const online = state.players.filter(p => p.connected !== false).length;
      document.getElementById('playerCount').textContent = online + ' in lobby';

      if (state.players.length === 0) {
        grid.innerHTML = '<div class="text-sm text-slate-500">Waiting for players to join...</div>';
        return;
      }

      const suggestions = (state.lobby && state.lobby.gameSuggestions) || {};
      const ranked = [...state.players].sort((a, b) => (b.sessionScore || 0) - (a.sessionScore || 0));
      grid.innerHTML = ranked.map((p, i) => {
        const voted = suggestions[p.playerId];
        const crown = p.isAdmin ? '<i class="fa-solid fa-crown text-amber-500 text-xs"></i>' : '';
        return '<div class="flex justify-between items-center py-2 px-3 rounded-xl ' +
            (i === 0 && p.sessionScore ? 'bg-white text-slate-800' : 'bg-white/60 text-slate-700') + (p.connected === false ? ' opacity-50' : '') + '">' +
          '<span class="flex items-center gap-2 min-w-0 font-semibold">' +
            '<span class="text-xl">' + escapeHtml(p.avatar || '') + '</span>' + crown +
            '<span class="truncate">' + escapeHtml(p.username || p.name) + '</span>' +
            (voted ? '<span class="text-sm" title="Voted ' + escapeHtml(shGame(voted).label) + '">' + shGame(voted).icon + '</span>' : '') +
          '</span>' +
          '<span class="font-bold text-sky-700 shrink-0">' + (p.sessionScore || 0) + ' pts</span>' +
        '</div>';
      }).join('');
    }

    // Live tallies: game wishes, or the quiz category vote once it opens.
    function renderHostVotes() {
      const lobby = state.lobby || {};
      const list = document.getElementById('hostVotes');
      const title = document.getElementById('voteTitle');
      const hint = document.getElementById('voteHint');
      let rows, total;

      if (lobby.votingActive) {
        title.textContent = 'Quiz Category';
        hint.textContent = 'Vote for a topic on your phone. The most picked category is played.';
        const tallies = lobby.voteTallies || {};
        total = Object.values(tallies).reduce((s, n) => s + n, 0);
        rows = (lobby.availableCategories || [])
          .map(c => ({ icon: shCategoryIcon(c.name), label: shCategoryLabel(c.name), count: tallies[c.id] || 0 }))
          .sort((a, b) => b.count - a.count)
          .slice(0, 8);
      } else {
        title.textContent = 'Vote for next activity';
        hint.textContent = 'Wish for a game on your phone. The most picked game is chosen and the next phase begins.';
        const counts = {};
        Object.values(lobby.gameSuggestions || {}).forEach(g => { counts[g] = (counts[g] || 0) + 1; });
        total = Object.values(counts).reduce((s, n) => s + n, 0);
        rows = SH_GAMES.filter(g => g.hasUi || counts[g.type])
          .map(g => ({ icon: g.icon, label: g.label, count: counts[g.type] || 0, leader: g.type === lobby.leadingGame }))
          .sort((a, b) => b.leader - a.leader || b.count - a.count);
      }

      document.getElementById('voteCount').textContent = total + ' vote' + (total === 1 ? '' : 's');
      const max = Math.max(1, ...rows.map(r => r.count));
      const leadCount = Math.max(0, ...rows.map(r => r.count));
      list.innerHTML = rows.map(r => {
        const leading = r.leader || (lobby.votingActive && r.count > 0 && r.count === leadCount);
        const pct = Math.round((r.count / max) * 100);
        return '<div class="relative overflow-hidden rounded-2xl border ' +
            (leading ? 'bg-sky-600 border-sky-500 text-white shadow-md shadow-sky-600/25' : 'bg-white/80 border-sky-200 text-slate-800') + '">' +
          '<div class="absolute inset-y-0 left-0 ' + (leading ? 'bg-white/15' : 'bg-sky-100') + ' transition-all duration-500" style="width:' + pct + '%"></div>' +
          '<div class="relative flex items-center justify-between px-4 py-3">' +
            '<span class="flex items-center gap-3 font-bold text-lg"><span class="text-2xl">' + r.icon + '</span>' + escapeHtml(r.label) +
              (leading ? '<span class="text-xs font-semibold bg-white/20 px-2 py-0.5 rounded-full">Most picked</span>' : '') + '</span>' +
            '<span class="font-bold ' + (leading ? '' : 'text-sky-700') + '">' + r.count + '</span>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    // --- Render: Game ---
    function showGameView(msg) {
      state.gameEvents = [];
      document.getElementById('lobbyView').style.display = 'none';
      document.getElementById('gameView').style.display = 'flex';
      document.getElementById('scorePanel').style.display = 'block';
      // Chat only shows once someone has written something (no empty box in the corner)
      if (document.getElementById('chatMessages').children.length) {
        document.getElementById('chatPanel').style.display = 'flex';
      }
      document.body.classList.add('in-game');

      const titles = {
        'number-guess': 'Number Guess',
        'quiz': 'Quiz Time',
        'music-quiz': 'Music Quiz',
        'spy': 'Spy Game',
        'shithead': 'Shithead',
        'question-form': 'Question Form',
        'gin-rummy': 'Gin Rummy',
        'hilow': 'Högt/Lågt',
        'skogai': 'SkogAI',
        'sjuan': 'Sjuan',
        'uno': 'Uno',
        'yatzy': 'Yatzy',
        'labyrint': 'Labyrint',
        'template': 'Template'
      };
      document.getElementById('gameTitle').textContent = titles[msg.gameType] || msg.gameType;
      document.getElementById('roundInfo').textContent = '';

      // Narrate the game's story (intro + TTS voice), but not when rejoining a running game
      if (!msg.resume && !['quiz', 'music-quiz'].includes(msg.gameType)) playStory(msg.gameType);
    }

    // --- Game story / narration ---
    let storyAudio = null;
    async function speakText(text) {
      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voice: 'Enceladus' }),
        });
        if (!res.ok) return; // TTS optional; fail silently
        const data = await res.json();
        if (data.url) {
          if (storyAudio) storyAudio.pause();
          storyAudio = new Audio(data.url);
          storyAudio.play().catch(() => {});
        }
      } catch (e) { /* TTS optional */ }
    }

    function playStory(gameType) {
      const story = (window.SMALL_HOURS_STORIES && window.SMALL_HOURS_STORIES[gameType]) || null;
      if (!story) return;
      const overlay = document.getElementById('storyOverlay');
      const badge = document.getElementById('storyBadge');
      const title = document.getElementById('storyTitle');
      const text = document.getElementById('storyText');
      const skip = document.getElementById('storySkipBtn');

      badge.textContent = story.badge || '⚔️';
      title.textContent = story.title;
      text.textContent = story.intro;
      overlay.className = 'story-overlay theme-' + (story.theme || 'purple');
      overlay.style.display = 'flex';

      const close = () => {
        overlay.style.display = 'none';
        if (storyAudio) storyAudio.pause();
      };
      skip.onclick = close;
      // Auto-dismiss after the narration window (skip if no TTS).
      setTimeout(close, 7000);
      // Speak the intro aloud (best-effort).
      speakText(story.intro);
    }

    function renderGameState(msg) {
      if (!state.gameType) return;

      switch (state.gameType) {
        case 'number-guess': renderNumberGuess(msg); break;
        case 'quiz': case 'music-quiz': renderQuiz(msg); break;
        case 'spy': renderSpy(msg); break;
        case 'shithead': renderShithead(msg); break;
        case 'question-form': renderQuestionForm(msg); break;
        case 'gin-rummy': renderGinRummy(msg); break;
        case 'template': renderTemplate(msg); break;
      }

      if (msg.scores || state.gameType === 'number-guess' || state.gameType === 'shithead') {
        renderScoreboard(msg, state.gameType);
      }
      if (msg.phase === 'lobby' || msg.phase === 'finished') returnToLobby(msg);
    }

    function renderNumberGuess(msg) {
      const content = document.getElementById('gameContent');
      const events = state.gameEvents || [];

      // Build guess log from events
      const guessEvents = events.filter(e => e.type === 'guess_result');

      let html = '<div class="number-guess-display">';

      if (msg.phase === 'finished') {
        html += '<div class="guess-feedback" style="color:var(--neon-green);font-size:2rem;">Number found!</div>';
        if (msg.secret) {
          html += '<div style="font-size:1.5rem;margin:12px 0;">The number was <strong style="color:var(--neon-blue);">' + msg.secret + '</strong></div>';
        }
      } else {
        html += '<div class="guess-round-label">Guessing in progress...</div>' +
          '<div class="guess-range" style="font-size:3rem;">1 &mdash; 100</div>';
      }

      if (guessEvents.length > 0) {
        html += '<div class="card" style="max-width:500px;margin:16px auto;text-align:left;">';
        // Show last 10 guesses
        guessEvents.slice(-10).forEach(g => {
          const icon = g.result === 'correct' ? '&#9989;' : (g.result === 'too_high' ? '&#11015; Too high' : '&#11014; Too low');
          const color = g.result === 'correct' ? 'var(--neon-green)' : 'var(--text-secondary)';
          // Look up player name
          const name = (state.playerNames || {})[g.playerId] || 'Player';
          html += '<div class="clue-item"><span class="clue-author">' + escapeHtml(name) + '</span>' +
            '<span style="color:' + color + ';">' + g.number + ' ' + icon + '</span></div>';
        });
        html += '</div>';
      } else {
        html += '<div style="color:var(--text-secondary);margin-top:24px;">Waiting for guesses...</div>';
      }

      html += '</div>';
      content.innerHTML = html;
    }

    // --- Music Quiz audio (plays on the TV only) ---
    let musicAudio = null;
    let musicQuestionId = null;
    let musicFade = null;

    function syncMusic(msg) {
      const q = msg.question;
      const preview = q && q.media && q.media.preview;
      const audible = msg.phase === 'question' || msg.phase === 'reveal';
      if (!preview || !audible) {
        if (!audible) stopMusic();
        return;
      }
      // Re-renders within the same question keep the clip running
      if (q.id === musicQuestionId) { musicFade.sync(msg); return; }
      if (msg.phase !== 'question') return;
      stopMusic();
      musicQuestionId = q.id;
      musicAudio = new Audio(preview);
      musicAudio.muted = isMuted;
      musicFade = createMusicFade(musicAudio);
      musicFade.start(msg.timeLeft);
      musicAudio.play().catch(showSoundUnlock);
    }

    function stopMusic() {
      if (musicFade) musicFade.stop();
      musicFade = null;
      if (musicAudio) musicAudio.pause();
      musicAudio = null;
      musicQuestionId = null;
      hideSoundUnlock();
    }

    // Browsers block autoplay until the page has been clicked once

    function musicPanel(msg) {

        return '<div class="flex items-center justify-center gap-5 my-1">' +

    // --- Question countdown, ticked locally from the server's time left ---
    const hostCountdown = { deadline: 0, total: 0, interval: null };

    function startHostCountdown(timeLeft, timeTotal) {
      hostCountdown.deadline = Date.now() + timeLeft * 1000;
      hostCountdown.total = timeTotal;
      if (!hostCountdown.interval) hostCountdown.interval = setInterval(tickHostCountdown, 250);
      tickHostCountdown();
    }

    function tickHostCountdown() {
      const left = Math.max(0, (hostCountdown.deadline - Date.now()) / 1000);
      const pct = hostCountdown.total ? (left / hostCountdown.total) * 100 : 0;
      const cls = 'timer-bar' + (pct < 20 ? ' critical' : pct < 40 ? ' warning' : '');
      // Only touch class/text when they change: Tailwind's CDN compiler re-runs on every class change
      const container = document.getElementById('timerContainer');
      if (container.style.display !== 'block') container.style.display = 'block';
      const bar = document.getElementById('timerBar');
      bar.style.width = pct + '%';
      if (bar.className !== cls) bar.className = cls;
      const seconds = document.getElementById('timerSeconds');
      const secCls = 'timer-seconds' + (pct < 20 ? ' critical' : pct < 40 ? ' warning' : '');
      const secText = String(Math.ceil(left));
      if (seconds.style.display) seconds.style.display = '';
      if (seconds.textContent !== secText) seconds.textContent = secText;
      if (seconds.className !== secCls) seconds.className = secCls;
      if (left <= 0) stopHostCountdown(true);
    }

    function stopHostCountdown(keepDisplay) {
      clearInterval(hostCountdown.interval);
      hostCountdown.interval = null;
      if (!keepDisplay) {
        hostCountdown.deadline = 0;
        document.getElementById('timerContainer').style.display = 'none';
        document.getElementById('timerSeconds').style.display = 'none';
      }
    }

    function renderQuiz(msg) {
      const content = document.getElementById('gameContent');
      const timerContainer = document.getElementById('timerContainer');
      const timerBar = document.getElementById('timerBar');
      const roundInfo = document.getElementById('roundInfo');

      // Quiz introductions must never cover a timed question.
      document.getElementById('storyOverlay').style.display = 'none';
      if (storyAudio) storyAudio.pause();
      if (msg.phase !== 'countdown') stopQuizReadyCountdown();
      syncMusic(msg);
      if (msg.phase !== 'question') stopHostCountdown();

      // Progress indicator ("Question 3 of 10")
      if (msg.currentQuestion != null && msg.totalQuestions) {
        roundInfo.textContent = 'Question ' + (msg.currentQuestion + 1) + ' of ' + msg.totalQuestions;
      }

      if (msg.phase === 'countdown') {
        timerContainer.style.display = 'none';
        content.innerHTML = '<div class="quiz-display countdown-phase">' +
          '<div class="quiz-question-text">Get ready!</div>' +
          '<div class="quiz-ready-number" id="quizReadyNumber" role="timer" aria-label="Quiz starts in">5</div>' +
          '<div class="quiz-countdown-text">First question coming up...</div>' +
          '</div>';
        startQuizReadyCountdown('quizReadyNumber', msg.timeLeft);
        return;
      }

      if (msg.phase === 'between') {
        timerContainer.style.display = 'none';
        const nextQ = (msg.currentQuestion != null ? msg.currentQuestion + 1 : '?');
        content.innerHTML = '<div class="quiz-display between-phase">' +
          '<div class="quiz-question-text">Next up: Question ' + nextQ + '</div>' +
          '<div class="quiz-between-text">Get ready for the next round...</div>' +
          '</div>';
        return;
      }

      if (msg.phase === 'question') {
        const q = msg.question || {};
        // One countdown only: the bar under the game title plus the seconds badge in the header
        let html = '<div class="quiz-display question-phase">' +
          '<div class="quiz-question-text">' + escapeHtml(q.text || '') + '</div>' +
          musicPanel(msg) +
          '<div class="quiz-answers-display">';

        const labels = ['A', 'B', 'C', 'D'];
        const neonColors = ['var(--neon-red)', 'var(--neon-blue)', 'var(--neon-green)', 'var(--neon-orange)'];
        (q.answers || []).forEach((a, i) => {
          html += '<button class="answer-btn answer-' + labels[i].toLowerCase() + '" style="background:' + neonColors[i] + '" data-index="' + i + '" aria-label="Answer ' + labels[i] + ': ' + escapeHtml(a) + '">' +
            '<span class="answer-label">' + labels[i] + '.</span>' +
            '<span class="answer-text">' + escapeHtml(a) + '</span>' +
          '</button>';
        });

        html += '</div>';

        const timed = msg.timeLeft != null && msg.timeTotal;
        if (!timed) timerContainer.style.display = 'none';

        html += '</div>';
        content.innerHTML = html;
        // Tick the countdown locally from the server's time left (bar + seconds badge)
        if (timed) startHostCountdown(msg.timeLeft, msg.timeTotal);
        else if (hostCountdown.deadline) tickHostCountdown();
      } else if (msg.phase === 'reveal') {
        timerContainer.style.display = 'none';
        const q = msg.question || {};
        let html = '<div class="quiz-display reveal-phase">' +
          '<div class="quiz-question-text">' + escapeHtml(q.text || '') + '</div>' +
          musicPanel(msg) +
          '<div class="quiz-answers-display">';

        const labels = ['A', 'B', 'C', 'D'];
        const neonColors = ['var(--neon-red)', 'var(--neon-blue)', 'var(--neon-green)', 'var(--neon-orange)'];
        (q.answers || []).forEach((a, i) => {
          const isCorrect = i === msg.correctIndex;
          const mark = isCorrect ? '<span class="answer-mark correct" aria-label="Correct answer">&#9989;</span>' : '<span class="answer-mark incorrect" aria-label="Incorrect">&#10060;</span>';
          const correctClass = isCorrect ? ' correct' : ' incorrect';
          const names = msg.playerNames || state.playerNames || {};
          const guesses = Object.entries(msg.playerAnswers || {})
            .filter(([, answer]) => answer === a)
            .map(([pid]) => '<span class="answer-player">' + playerAvatarHtml(pid) +
              '<span>' + escapeHtml(names[pid] || 'Player') + '</span></span>');
          const guessHtml = '<span class="answer-guesses">' +
            (guesses.length ? guesses.join(' ') : 'No guesses') + '</span>';
          html += '<button class="answer-btn answer-' + labels[i].toLowerCase() + correctClass + '" style="background:' + (isCorrect ? 'var(--neon-green)' : neonColors[i]) + '" disabled aria-disabled="true" aria-label="' + (isCorrect ? 'Correct answer: ' : 'Incorrect: ') + escapeHtml(a) + '">' +
            '<span class="answer-label">' + labels[i] + '.</span>' +
            '<span class="answer-text">' + escapeHtml(a) + '</span>' +
            mark + guessHtml +
          '</button>';
        });

        html += '</div></div>';
        content.innerHTML = html;
      }
    }

    function renderQuestionForm(msg) {
      const content = document.getElementById('gameContent');
      const names = state.playerNames || msg.playerNames || {};

      if (msg.phase === 'answering') {
        const total = msg.totalPlayers || '?';
        const submitted = msg.submittedCount || 0;
        content.innerHTML = '<div class="qf-display">' +
          '<div class="qf-host-question">Waiting for answers...</div>' +
          '<div class="qf-waiting">' + submitted + ' / ' + total + ' players submitted</div>' +
          '<div style="margin-top:24px;">' +
            '<div style="width:200px;height:8px;border-radius:4px;background:rgba(15, 23, 42, 0.12);margin:0 auto;">' +
              '<div style="width:' + (total > 0 ? Math.round(submitted / total * 100) : 0) + '%;height:100%;border-radius:4px;background:var(--neon-purple);transition:width 0.3s;"></div>' +
            '</div>' +
          '</div>' +
          '</div>';
        return;
      }

      if (msg.phase === 'review' || msg.phase === 'finished') {
        const rq = msg.reviewQuestion || {};
        const questions = msg.questions || [];
        const qi = msg.currentQuestion || 0;

        let html = '<div class="qf-display">';

        // Question dots
        html += '<div class="qf-progress-dots">';
        questions.forEach(function(q, i) {
          html += '<div class="qf-dot' + (i === qi ? ' active' : '') + '"></div>';
        });
        html += '</div>';

        html += '<div class="qf-host-label">Question ' + (qi + 1) + ' of ' + questions.length + '</div>';
        html += '<div class="qf-host-question">' + escapeHtml(rq.text || '') + '</div>';

        if (msg.tally) {
          const maxCount = Math.max(...Object.values(msg.tally), 1);
          const options = rq.type === 'yesno' ? ['yes', 'no'] : (rq.options || Object.keys(msg.tally));
          const barClasses = rq.type === 'yesno' ? { yes: 'yes', no: 'no' } : {};
          const defaultClasses = ['a', 'b', 'c', 'd'];
          html += '<div class="qf-host-tally">';
          options.forEach(function(opt, i) {
            const count = msg.tally[opt] || 0;
            const pct = Math.round((count / maxCount) * 100);
            const cls = barClasses[opt] || defaultClasses[i % 4];
            html += '<div class="qf-host-bar ' + cls + '" style="width:' + Math.max(pct, 15) + '%;">' +
              escapeHtml(opt) + ' \u2014 ' + count + '</div>';
          });
          html += '</div>';

          html += '<div class="qf-host-average">' + msg.average + '</div>' +
            '<div style="font-size:1rem;color:var(--text-secondary);">Average rating</div>';
        } else {
          // Text responses
          (msg.allResponses || []).forEach(function(r) {
            const name = names[r.playerId] || 'Player';
            html += '<div class="qf-host-response"><strong>' + escapeHtml(name) + ':</strong> ' + escapeHtml(String(r.value)) + '</div>';
          });
          if (!msg.allResponses || msg.allResponses.length === 0) {
            html += '<div class="qf-waiting">No responses</div>';
          }
        }

        html += '</div>';
        content.innerHTML = html;
      }
    }

    function renderGinRummy(msg) {
      const content = document.getElementById('gameContent');
      const names = state.playerNames || msg.playerNames || {};
      const cum = msg.cumulative || {};
      const boxes = msg.boxes || {};
      const pids = Object.keys(cum);

      // Sound transitions for Gin Rummy
      if (lastGrState.round != null && msg.round > lastGrState.round) {
        audio.play('deck_redraw');
      }
      if (msg.phase === 'scoring' && lastGrState.phase !== 'scoring') {
        audio.play('win');
      }
      if (msg.phase === 'finished' && lastGrState.phase !== 'finished') {
        audio.play('win');
      }
      if (msg.phase === 'drawing' && lastGrState.phase === 'drawing') {
        if (msg.stockCount != null && lastGrState.stockCount != null && msg.stockCount < lastGrState.stockCount) {
          audio.play('draw');
        }
        if (msg.discardCount != null && lastGrState.discardCount != null && msg.discardCount > lastGrState.discardCount) {
          audio.play('place');
        }
      }
      lastGrState = { round: msg.round, phase: msg.phase, stockCount: msg.stockCount, discardCount: msg.discardCount };

      let html = '<div style="text-align:center;">';

      // Scores bar
      html += '<div style="display:flex;justify-content:center;gap:40px;margin:16px 0;">';
      pids.forEach(pid => {
        html += '<div>' +
          '<div style="font-size:1.1rem;font-weight:700;color:var(--text-primary);">' + escapeHtml(names[pid] || pid) + '</div>' +
          '<div style="font-size:2rem;font-weight:900;color:var(--neon-blue);">' + (cum[pid] || 0) + '</div>' +
          '<div style="font-size:0.8rem;color:var(--text-secondary);">' + (boxes[pid] || 0) + ' boxes</div>' +
        '</div>';
      });
      html += '</div>';

      // Hand info
      if (msg.handNumber) {
        html += '<div style="color:var(--text-secondary);font-size:1rem;margin:8px 0;">Hand ' + msg.handNumber + '</div>';
      }

      // Table: stock + discard
      html += '<div style="display:flex;justify-content:center;gap:40px;margin:16px 0;align-items:center;">';
      html += '<div><div style="font-size:0.85rem;color:var(--text-secondary);">Stock</div><div style="font-size:1.8rem;font-weight:700;">' + (msg.stockCount || 0) + '</div></div>';
      if (msg.discardTop) {
        html += '<div><div style="font-size:0.85rem;color:var(--text-secondary);">Discard</div>' + renderCardImg(msg.discardTop, {width: 68, height: 96, pileCard: true}) + '</div>';
      } else {
        html += '<div><div style="font-size:0.85rem;color:var(--text-secondary);">Discard</div><div style="color:var(--text-secondary);">Empty</div></div>';
      }
      html += '</div>';

      // Phase / turn
      if (msg.phase === 'scoring') {
        const hr = msg.handResult || {};
        if (hr.type === 'cancelled') {
          html += '<div style="font-size:1.5rem;color:var(--text-secondary);margin:16px 0;">Hand cancelled (stock exhausted)</div>';
        } else if (hr.type) {
          const winnerName = names[hr.winner] || hr.winner;
          const typeLabels = { knock: 'Knock', undercut: 'Undercut!', gin: 'GIN!', bigGin: 'BIG GIN!' };
          const typeColors = { knock: 'var(--neon-blue)', undercut: 'var(--neon-pink)', gin: 'var(--neon-green)', bigGin: 'var(--neon-green)' };
          html += '<div style="font-size:1.8rem;font-weight:700;color:' + (typeColors[hr.type] || 'var(--text-primary)') + ';margin:12px 0;">' + (typeLabels[hr.type] || hr.type) + '</div>';
          html += '<div style="font-size:1.3rem;">' + escapeHtml(winnerName) + ' wins +' + (hr.points || 0) + '</div>';
        }

        // Show melds
        if (msg.knockerMelds) {
          const knockerName = names[msg.knocker] || msg.knocker;
          const oppId = pids.find(id => id !== msg.knocker);
          const oppName = names[oppId] || oppId;

          html += '<div style="display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-top:16px;">';
          // Knocker melds
          html += '<div class="card" style="padding:12px;min-width:200px;"><div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;">' + escapeHtml(knockerName) + '</div>';
          (msg.knockerMelds || []).forEach(m => {
            html += '<div style="display:flex;gap:2px;margin-bottom:4px;">' + m.cards.map(c => renderCardImg(c, {width: 40, height: 56})).join('') + '</div>';
          });
          if (msg.knockerDeadwood && msg.knockerDeadwood.length > 0) {
            html += '<div style="font-size:0.75rem;color:var(--text-secondary);margin-top:6px;">Deadwood: ' + msg.knockerDeadwood.map(c => renderCardImg(c, {width: 36, height: 50})).join('') + '</div>';
          }
          html += '</div>';

          // Opponent melds
          html += '<div class="card" style="padding:12px;min-width:200px;"><div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;">' + escapeHtml(oppName) + '</div>';
          (msg.opponentMelds || []).forEach(m => {
            html += '<div style="display:flex;gap:2px;margin-bottom:4px;">' + m.cards.map(c => renderCardImg(c, {width: 40, height: 56})).join('') + '</div>';
          });
          if (msg.opponentDeadwood && msg.opponentDeadwood.length > 0) {
            html += '<div style="font-size:0.75rem;color:var(--text-secondary);margin-top:6px;">Deadwood: ' + msg.opponentDeadwood.map(c => renderCardImg(c, {width: 36, height: 50})).join('') + '</div>';
          }
          html += '</div>';
          html += '</div>';
        }
      } else if (msg.phase === 'finished' && msg.finalScores) {
        html += '<div style="font-size:2rem;color:var(--neon-green);margin:16px 0;">Game Over!</div>';
        const winner = msg.winner;
        if (winner) {
          html += '<div style="font-size:1.5rem;color:var(--neon-blue);">' + escapeHtml(names[winner] || winner) + ' wins!</div>';
        }
      } else {
        // Playing phase — show whose turn
        const events = msg.events || [];
        const lastEvent = events.length > 0 ? events[events.length - 1] : null;
        if (lastEvent) {
          const evName = names[lastEvent.playerId] || lastEvent.playerId || '';
          if (lastEvent.type === 'draw') {
            html += '<div style="color:var(--text-secondary);font-size:1rem;margin:8px 0;">' + escapeHtml(evName) + ' drew from ' + lastEvent.source + '</div>';
          } else if (lastEvent.type === 'discard') {
            html += '<div style="color:var(--text-secondary);font-size:1rem;margin:8px 0;">' + escapeHtml(evName) + ' discarded</div>';
          }
        }
      }

      html += '</div>';
      content.innerHTML = html;
    }

    function renderShithead(msg) {

          audio.play('draw');
        } else if (lastShState.pileCount != null && msg.pileCount > lastShState.pileCount) {

        if (msg.phase === 'finished' && lastShState.phase !== 'finished') {
          audio.play('win');

          html += '<div class="swap-status-grid">';

            html += '<div class="swap-status-card card">' +

            if (isOut) {
              html += '<span class="out-badge" aria-label="Player is out">✓ Out</span>';
            }
            html += '</div>';

            // Card counts
            html += '<div class="player-card-counts">';
            html += '<span class="count-item"><span class="count-label">Hand:</span> <span class="count-value">' + (p.handCount || 0) + '</span></span>';
            html += '<span class="count-item"><span class="count-label">Down:</span> <span class="count-value">' + (p.faceDownCount || 0) + '</span></span>';
            html += '</div>';

            // Face-up cards (visible to all) — fanned layout
            if (p.faceUp && p.faceUp.length > 0) {
              html += '<div class="face-up-fan" aria-label="Face up cards">';
              
              // Group cards by rank+suit
              const groups = {};
              p.faceUp.forEach(c => {
                const key = c.rank + c.suit;
                if (!groups[key]) groups[key] = { card: c, count: 0 };
                groups[key].count++;
              });

              Object.values(groups).sort((a, b) => a.card.rank - b.card.rank).forEach((g, idx) => {
                const c = g.card;
                const countBadge = g.count > 1 ? '<span class="count-badge">' + g.count + '</span>' : '';
                html += '<div class="fan-card" style="--card-index: ' + idx + ';">' + countBadge + renderCardImg(c, {width: 50, height: 70}) + '</div>';
              });
              html += '</div>';
            }

            html += '</div>';
          });
        }
        html += '</div>';
      }

      html += '</div>';
      content.innerHTML = html;
    }

    function playerAvatarHtml(playerId) {
      const avatar = (state.playerAvatars || {})[playerId] ||
        (state.players || []).find(p => p.playerId === playerId)?.avatar || '👤';
      return '<span class="inline-player-avatar" aria-hidden="true">' + escapeHtml(avatar) + '</span> ';
    }

    // Normalize each game's score shape into one unified scoreboard model.
    // Returns { roundLabel, status, entries:[{id,name,valueText,rank,isOut}] }.
    // `entries` is already sorted best-first; rank is 1-based.
    function getScoreboardData(msg, gameType) {
      const names = msg.playerNames || {};
      const scores = msg.scores || {};
      const ids = Object.keys(scores);

      let entries;
      let roundLabel = null;
      let status = (msg.phase === 'finished') ? 'Klart' : 'Spelar';

      if (gameType === 'shithead') {
        // `scores` here is players.length - placement; derive true placement from finishOrder.
        const finishOrder = msg.finishOrder || [];
        // Best-first: those who went out first rank above those still in.
        const rankedIds = [
          ...finishOrder,
          ...ids.filter(id => !finishOrder.includes(id)),
        ];
        entries = rankedIds.map((id, i) => ({
          id,
          name: names[id] || id,
          valueText: finishOrder.includes(id) ? 'Plats ' + (i + 1) : 'Spelar',
          rank: i + 1,
          isOut: finishOrder.includes(id),
        }));
      } else if (gameType === 'number-guess') {
        // `scores` = maxRounds - guesses (guesses remaining). Higher = better.
        const maxRounds = msg.maxRounds || 0;
        const sorted = ids.slice().sort((a, b) => scores[b] - scores[a]);
        entries = sorted.map((id, i) => {
          const guessesLeft = scores[id];
          return {
            id,
            name: names[id] || id,
            valueText: guessesLeft + ' gissningar kvar',
            rank: i + 1,
            isOut: false,
          };
        });
        if (msg.round != null && maxRounds) {
          roundLabel = 'Round ' + (msg.round + 1) + ' / ' + maxRounds;
        }
      } else {
        // quiz / spy / gin-rummy / template: scores are accumulated points, higher = better.
        const sorted = ids.slice().sort((a, b) => scores[b] - scores[a]);
        entries = sorted.map((id, i) => ({
          id,
          name: names[id] || id,
          valueText: scores[id] + ' p',
          rank: i + 1,
          isOut: false,
        }));
        if ((gameType === 'quiz' || gameType === 'music-quiz') && msg.totalQuestions) {
          roundLabel = 'Fråga ' + ((msg.currentQuestion || 0) + 1) + ' / ' + msg.totalQuestions;
        } else if (gameType === 'spy' && msg.totalRounds) {
          roundLabel = 'Round ' + (msg.round || 0) + ' / ' + msg.totalRounds;
        } else if (gameType === 'gin-rummy' && msg.handNumber != null) {
          roundLabel = 'Hand ' + msg.handNumber;
        }
      }

      return { roundLabel, status, entries };
    }

    function renderScoreboard(msg, gameType) {
      const list = document.getElementById('scoreList');
      const { roundLabel, status, entries } = getScoreboardData(msg, gameType);

      let header = '<h3 class="score-panel-title neon">Live Scores</h3>';
      const meta = [];
      if (roundLabel) meta.push(roundLabel);
      if (status) meta.push(status);
      if (meta.length) {
        header += '<div class="score-panel-meta">' + escapeHtml(meta.join(' · ')) + '</div>';
      }

      const rows = entries.map(e => {
        const rankClass = e.rank === 1 ? 'rank-gold' : e.rank === 2 ? 'rank-silver' : e.rank === 3 ? 'rank-bronze' : '';
        const outBadge = e.isOut ? ' <span class="score-out-badge">UTE</span>' : '';
        return '<div class="score-entry card' + (e.isOut ? ' is-out' : '') + '" data-player-id="' + escapeHtml(e.id) + '">' +
          '<span class="score-rank ' + rankClass + '">' + e.rank + '</span>' +
          '<span class="score-name">' + playerAvatarHtml(e.id) + escapeHtml(e.name) + outBadge + '</span>' +
          '<span class="score-value">' + escapeHtml(e.valueText) + '</span></div>';
      }).join('');

      list.innerHTML = header + rows;
    }

    function returnToLobby(msg) {
      if (msg.phase === 'finished') {
        if (msg.winner) {
          const name = (state.playerNames || {})[msg.winner] || 'Someone';
          showToast(name + ' wins!', 'success');
          spawnConfetti();
        }
        // Show final state for a few seconds then return to lobby
        setTimeout(() => {
          state.gameType = null;
          state.gameEvents = [];
          document.getElementById('lobbyView').style.display = '';
          document.getElementById('gameView').style.display = 'none';
          document.getElementById('scorePanel').style.display = 'none';
          document.getElementById('timerContainer').style.display = 'none';
          document.body.classList.remove('in-game');
        }, 4000);
      } else if (msg.phase === 'lobby') {
        state.gameType = null;
        state.gameEvents = [];
        document.getElementById('lobbyView').style.display = '';
        document.getElementById('gameView').style.display = 'none';
        document.getElementById('scorePanel').style.display = 'none';
        document.getElementById('timerContainer').style.display = 'none';
        document.body.classList.remove('in-game');
      }
    }

    // --- Chat ---
    function addChatMessage(name, text, avatar) {
      const panel = document.getElementById('chatPanel');
      panel.style.display = 'flex';
      const container = document.getElementById('chatMessages');
      const el = document.createElement('div');
      el.className = 'chat-msg';
      el.innerHTML = '<span class="author"><span class="chat-avatar" aria-hidden="true">' + escapeHtml(avatar || '💬') + '</span> ' + escapeHtml(name || 'Player') + '</span><span class="chat-text">' + escapeHtml(text) + '</span>';
      container.appendChild(el);
      container.scrollTop = container.scrollHeight;

      // Keep max 50 messages
      while (container.children.length > 50) {
        container.removeChild(container.firstChild);
      }
    }

    // --- UI Helpers ---
    function setConnectionStatus(status, text) {
      const el = document.getElementById('connStatus');
      el.className = 'connection-status ' + status;
      document.getElementById('connText').textContent = text;
    }

    function showToast(message, type) {
      const container = document.getElementById('toasts');
      const toast = document.createElement('div');
      toast.className = 'toast' + (type ? ' toast-' + type : '');
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('toast-exit');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function spawnConfetti() {
      const colors = ['#0284c7', '#0c82eb', '#059669', '#db2777', '#d97706', '#dc2626'];
      for (let i = 0; i < 60; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (2 + Math.random() * 3) + 's';
        piece.style.animationDelay = (Math.random() * 0.5) + 's';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.width = (6 + Math.random() * 8) + 'px';
        piece.style.height = (6 + Math.random() * 8) + 'px';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 5500);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
