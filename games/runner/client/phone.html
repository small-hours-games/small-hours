<section id="runnerSection" class="game-section hidden">
  <div class="rn-phone-wrap">
    <div class="rn-phone-header">
      <div class="flex items-center gap-2.5">
        <span id="rnMyAvatar" class="rn-avatar"></span>
        <div>
          <div id="rnMyName" class="font-bold text-white text-sm">Runner</div>
          <div id="rnMyLives" class="text-xs text-pink-300">❤️❤️❤️ • 💎 0</div>
        </div>
      </div>
      <div class="text-right">
        <div id="rnMyScore" class="text-lg font-black text-cyan-300">0</div>
        <button id="rnMotionToggle" type="button" class="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
          📱 Tilt: Off
        </button>
      </div>
    </div>

    <div id="rnLettersBar" class="rn-letters-bar">
      <span class="rn-letter-chip">H</span>
      <span class="rn-letter-chip">O</span>
      <span class="rn-letter-chip">U</span>
      <span class="rn-letter-chip">R</span>
      <span class="rn-letter-chip">S</span>
    </div>

    <div id="rnSwipePad" class="rn-swipe-pad">
      <div class="text-3xl mb-1">⚡</div>
      <div class="font-extrabold text-sm">Swipe Left / Right / Up</div>
      <div id="rnPadHint" class="text-xs text-slate-400 mt-1">Or tap buttons below</div>
    </div>

    <div class="rn-dpad-row">
      <button id="rnLeftBtn" type="button" class="rn-ctrl-btn">◀ Left</button>
      <button id="rnJumpBtn" type="button" class="rn-ctrl-btn jump">⬆ Jump</button>
      <button id="rnRightBtn" type="button" class="rn-ctrl-btn">Right ▶</button>
    </div>
  </div>
</section>
